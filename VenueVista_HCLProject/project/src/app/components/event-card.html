<button
  type="button"
  class="glass rounded-2xl overflow-hidden card-tilt group border-2 border-transparent transition-all duration-300 cursor-pointer text-left w-full anim-fade-up"
  [class]="accent().hover"
  [style.animation-delay.ms]="index() * 80"
  (click)="onCardClick()"
>
  <div class="relative h-44 overflow-hidden">
    <img
      [src]="event().image"
      [alt]="event().title"
      class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 opacity-70"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/40 to-transparent"></div>
    @if (isSoldOut()) {
      <div class="absolute top-3 right-3 px-3 py-1 rounded-full bg-neon-pink/90 text-white text-xs font-mono font-bold tracking-wider">
        SOLD OUT
      </div>
    }
    <div class="absolute top-3 left-3 glass rounded-lg px-3 py-1.5">
      <span class="font-mono text-xs font-bold" [class]="accent().text">{{ dateLabel() }}</span>
    </div>
  </div>

  <div class="p-5">
    <h3 class="font-display text-lg font-bold text-white leading-tight mb-1">{{ event().title }}</h3>
    <p class="text-xs font-mono mb-3" [class]="accent().text">{{ event().artist }} · {{ event().genre }}</p>

    <div class="flex items-center gap-1 text-xs text-zinc-400 font-mono mb-1">
      <app-icon name="map-pin" cssClass="w-3 h-3" />
      <span>{{ event().venue }}, {{ event().city }}</span>
    </div>
    <div class="flex items-center gap-1 text-xs text-zinc-500 font-mono mb-4">
      <app-icon name="calendar" cssClass="w-3 h-3" />
      <span>{{ event().time }}</span>
    </div>

    <div class="mb-4">
      <div class="flex justify-between text-xs font-mono text-zinc-500 mb-1">
        <span>{{ soldPct() }}% sold</span>
        <span>{{ event().capacity - event().soldCount }} left</span>
      </div>
      <div class="h-1.5 rounded-full bg-white/5 overflow-hidden">
        <div
          class="h-full rounded-full transition-all duration-700"
          [class]="accent().bg"
          [style.width.%]="soldPct()"
        ></div>
      </div>
    </div>

    <div class="flex items-center justify-between">
      <div>
        <span class="text-xs font-mono text-zinc-500 block">from</span>
        <span class="font-mono text-xl font-bold text-white">₹{{ event().basePrice }}</span>
      </div>
      <span
        role="button"
        class="px-4 py-2.5 rounded-xl text-xs font-mono font-bold tracking-widest uppercase flex items-center gap-1.5 transition-all cursor-pointer disabled:opacity-40"
        [class]="isSoldOut() ? 'bg-white/5 text-zinc-500' : 'bg-white/5 border border-white/10 ' + accent().text + ' ' + accent().hover"
        [class.opacity-40]="isSoldOut()"
        (click)="onBuyClick($event)"
      >
        <app-icon name="ticket" cssClass="w-3.5 h-3.5" />
        {{ isSoldOut() ? 'Sold Out' : 'Buy Ticket' }}
      </span>
    </div>
  </div>
</button>
