<div class="min-h-screen bg-zinc-950 relative">
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute top-0 left-1/3 w-96 h-96 rounded-full bg-acid/5 blur-[150px]"></div>
    <div class="absolute bottom-0 right-1/3 w-96 h-96 rounded-full bg-electric-purple/5 blur-[150px]"></div>
  </div>

  @if (!showLogin()) {
    <app-navbar />
    <app-ticker />
  }

  <div class="relative z-10">
    <router-outlet />
  </div>

  @if (!showLogin()) {
    <app-checkout-modal />

    <footer class="relative z-10 border-t border-white/5 py-8 px-6">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
        <span class="font-display text-sm font-bold text-zinc-500">
          VENUE<span class="text-acid/50">VISTA</span>
        </span>
        <span class="font-mono text-xs text-zinc-600">Built for the underground. No cap.</span>
      </div>
    </footer>
  }
</div>
