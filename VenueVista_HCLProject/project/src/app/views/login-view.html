<div class="min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
  <div
    class="absolute inset-0 opacity-20"
    style="background-image: linear-gradient(rgba(163,255,18,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(163,255,18,0.1) 1px, transparent 1px); background-size: 60px 60px;"
  ></div>
  <div class="absolute top-1/4 left-1/4 w-72 h-72 rounded-full bg-acid/10 blur-[120px]"></div>
  <div class="absolute bottom-1/4 right-1/4 w-72 h-72 rounded-full bg-electric-purple/10 blur-[120px]"></div>

  <div class="glass rounded-2xl w-full max-w-md p-8 relative z-10 neo-border-acid glow-acid anim-modal">
    <div class="flex items-center justify-center gap-2 mb-8">
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-acid to-neon-cyan flex items-center justify-center">
        <app-icon name="zap" cssClass="w-5 h-5 text-zinc-950" [strokeWidth]="3" />
      </div>
      <span class="font-display font-black text-xl tracking-wider text-white">
        VENUE<span class="text-acid">VISTA</span>
      </span>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-6 p-1 rounded-xl bg-white/5 border border-white/10">
      <button
        type="button"
        (click)="setMode('login')"
        class="py-2.5 rounded-lg text-xs font-mono font-bold tracking-widest uppercase transition-all cursor-pointer"
        [class]="mode() === 'login' ? 'bg-gradient-to-r from-acid to-neon-cyan text-zinc-950' : 'text-zinc-400 hover:text-white'"
      >
        Sign In
      </button>
      <button
        type="button"
        (click)="setMode('signup')"
        class="py-2.5 rounded-lg text-xs font-mono font-bold tracking-widest uppercase transition-all cursor-pointer"
        [class]="mode() === 'signup' ? 'bg-gradient-to-r from-acid to-neon-cyan text-zinc-950' : 'text-zinc-400 hover:text-white'"
      >
        Sign Up
      </button>
    </div>

    <h2 class="font-display text-2xl font-black text-white mb-1">
      {{ mode() === 'login' ? 'Welcome Back' : 'Join the Underground' }}
    </h2>
    <p class="text-sm text-zinc-400 font-mono mb-6">
      {{ mode() === 'login' ? 'Sign in to access your stash.' : 'Create an account. No cap.' }}
    </p>

    <form (submit)="submit($event)" class="space-y-4">
      @if (mode() === 'signup') {
        <div>
          <label class="block text-xs font-mono text-zinc-400 tracking-widest uppercase mb-2">Display Name</label>
          <div class="relative">
            <app-icon name="user" cssClass="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500" />
            <input
              type="text"
              class="w-full bg-white/5 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-white font-mono text-sm placeholder:text-zinc-600 focus:outline-none focus:border-acid/50 transition-colors"
              placeholder="your_handle"
            />
          </div>
        </div>
      }

      <div>
        <label class="block text-xs font-mono text-zinc-400 tracking-widest uppercase mb-2">Username</label>
        <div class="relative">
          <app-icon name="user" cssClass="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500" />
          <input
            type="text"
            required
            [(ngModel)]="username"
            name="username"
            class="w-full bg-white/5 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-white font-mono text-sm placeholder:text-zinc-600 focus:outline-none focus:border-acid/50 transition-colors"
            placeholder="user1 or admin1"
          />
        </div>
      </div>

      @if (mode() === 'signup') {
        <div>
          <label class="block text-xs font-mono text-zinc-400 tracking-widest uppercase mb-2">Email</label>
          <div class="relative">
            <app-icon name="user" cssClass="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500" />
            <input
              type="email"
              required
              [(ngModel)]="email"
              name="email"
              class="w-full bg-white/5 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-white font-mono text-sm placeholder:text-zinc-600 focus:outline-none focus:border-acid/50 transition-colors"
              placeholder="you@example.com"
            />
          </div>
        </div>
      }

      <div>
        <label class="block text-xs font-mono text-zinc-400 tracking-widest uppercase mb-2">Password</label>
        <div class="relative">
          <app-icon name="zap" cssClass="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500" />
          <input
            type="password"
            required
            [minlength]="mode() === 'signup' ? 8 : 6"
            [(ngModel)]="password"
            name="password"
            class="w-full bg-white/5 border border-white/10 rounded-xl pl-10 pr-4 py-3 text-white font-mono text-sm placeholder:text-zinc-600 focus:outline-none focus:border-acid/50 transition-colors"
            placeholder="••••••••"
          />
        </div>
      </div>

      @if (error(); as err) {
        <div class="rounded-xl bg-neon-pink/10 border border-neon-pink/30 px-4 py-3 text-xs font-mono text-neon-pink">
          {{ err }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full py-4 rounded-xl bg-gradient-to-r from-acid to-neon-cyan text-zinc-950 font-display font-bold text-sm tracking-widest uppercase disabled:opacity-50 cursor-pointer flex items-center justify-center gap-2 hover:scale-[1.02] active:scale-[0.98] transition-transform"
      >
        @if (loading()) {
          <app-icon name="loader" cssClass="w-4 h-4 animate-spin" />
          Processing...
        } @else {
          {{ mode() === 'login' ? 'Sign In' : 'Create Account' }}
          <app-icon name="arrow-right" cssClass="w-4 h-4" />
        }
      </button>
    </form>

    <button
      type="button"
      (click)="back()"
      class="mt-6 w-full text-center text-xs font-mono text-zinc-500 hover:text-zinc-300 transition-colors cursor-pointer"
    >
      ← Back to home
    </button>
  </div>
</div>
